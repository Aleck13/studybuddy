<!DOCTYPE html>
<html>
<head>
    <title>StudyBuddy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .app {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: #f7f7f7;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
        }

        li button {
            float: right;
        }

        #piano {
            margin-top: 25px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>StudyBuddy 📚</h1>
    <p>Organizza i tuoi compiti!</p>

    <input id="compito" type="text" placeholder="Scrivi un compito">
    <input id="materia" type="text" placeholder="Materia">
    <input id="scadenza" type="date">

    <br>

    <button onclick="aggiungiCompito()">➕ Aggiungi</button>

    <button onclick="creaPiano()">✨ Crea piano di studio</button>

    <ul id="lista"></ul>

    <div id="piano"></div>

</div>

<script>

let compiti = JSON.parse(localStorage.getItem("compiti")) || [];

function mostraCompiti() {

    let lista = document.getElementById("lista");

    lista.innerHTML = "";

    compiti.forEach(function(compito, indice) {

        let nuovoCompito = document.createElement("li");

        nuovoCompito.textContent =
            (compito.fatto ? "✅ " : "☐ ") +
            compito.testo +
            " | 📚 " + compito.materia +
            " | 📅 " + compito.scadenza;

        nuovoCompito.onclick = function() {

            compiti[indice].fatto = !compiti[indice].fatto;

            localStorage.setItem(
                "compiti",
                JSON.stringify(compiti)
            );

            mostraCompiti();
        };

        let elimina = document.createElement("button");

        elimina.textContent = "❌";

        elimina.onclick = function(event) {

            event.stopPropagation();

            compiti.splice(indice, 1);

            localStorage.setItem(
                "compiti",
                JSON.stringify(compiti)
            );

            mostraCompiti();
        };

        nuovoCompito.appendChild(elimina);

        lista.appendChild(nuovoCompito);
    });
}


function aggiungiCompito() {

    let testo = document.getElementById("compito").value;
    let materia = document.getElementById("materia").value;
    let scadenza = document.getElementById("scadenza").value;

    if (testo === "") {
        return;
    }

    compiti.push({

        testo: testo,
        materia: materia,
        scadenza: scadenza,
        fatto: false

    });

    localStorage.setItem(
        "compiti",
        JSON.stringify(compiti)
    );

    document.getElementById("compito").value = "";
    document.getElementById("materia").value = "";
    document.getElementById("scadenza").value = "";

    mostraCompiti();
}


function creaPiano() {

    let materia =
        document.getElementById("materia").value.toLowerCase();

    let testo =
        document.getElementById("compito").value;

    let piano = document.getElementById("piano");

    if (testo === "") {

        piano.innerHTML =
            "<h2>⚠️ Prima scrivi cosa devi studiare!</h2>";

        return;
    }

    if (materia.includes("matematica")) {

        piano.innerHTML = `
            <h2>🧠 Piano di matematica</h2>
            <p>⏱️ 10 min — Ripassa le regole</p>
            <p>✏️ 15 min — Svolgi gli esercizi</p>
            <p>🔍 5 min — Controlla gli errori</p>
            <p>🎯 Obiettivo: ${testo}</p>
        `;

    } else if (materia.includes("storia")) {

        piano.innerHTML = `
            <h2>🏛️ Piano di storia</h2>
            <p>📖 10 min — Leggi l'argomento</p>
            <p>📝 10 min — Scrivi le cose più importanti</p>
            <p>🧠 5 min — Prova a ricordarle senza guardare</p>
            <p>🎯 Obiettivo: ${testo}</p>
        `;

    } else {

        piano.innerHTML = `
            <h2>✨ Piano di studio</h2>
            <p>📖 15 min — Studia l'argomento</p>
            <p>📝 10 min — Scrivi un breve riassunto</p>
            <p>🧠 5 min — Ripeti senza guardare</p>
            <p>🎯 Obiettivo: ${testo}</p>
        `;
    }
}


mostraCompiti();

</script>

</body>
</html>
